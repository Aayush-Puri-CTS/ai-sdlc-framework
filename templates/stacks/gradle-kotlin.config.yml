# Starter project.config.yml for an Android/Gradle/Kotlin stack.
# Copied verbatim into a new consuming repo by `node scripts/scaffold.mjs
# --template gradle-kotlin` when that repo has no project.config.yml yet.
# Edit every value below for your actual repo before your first task —
# this is a starting point, not a finished config. In particular:
# team.*, tiers.C_needs_reviewer, and ticket_source.* are almost
# certainly wrong for your repo as shipped.
version: 1

team:
  name: "CHANGE_ME-engineering"
  git_remote: "git@github.com:CHANGE_ME/CHANGE_ME.git"
  branch_prefixes:
    feature: "feat/"
    bug: "bug/"
    chore: "chore/"
    hotfix: "hotfix/"

stack:
  package_manager: "gradle"
  lint_cmd: "./gradlew ktlintCheck --file {file}"
  test_cmd: "./gradlew test --tests {base}Test"
  extra_validate_cmd: "./gradlew detekt"
  flags:
    no_install: true

verify_hook:
  include_glob: "app/src/**/*.kt"
  test_pattern: "{base}Test.kt"
  skip_globs:
    - "**/*.md"
    - "**/generated/**"
    - "**/build/**"
  loop_budget: 3

hard_rules:
  - id: "no-live-data"
    statement: "No connections to live/production endpoints or databases."
    audit: static
    review_gate: blocking
  - id: "no-pii-in-logs"
    statement: "No PII or sensitive account details written to analytics or console logs."
    audit: verifier
    review_gate: blocking

tiers:
  D_triggers:
    - "public API contract change"
    - "new native permission request"
    - "database schema or migration modification"
  E_triggers:
    - "production environment secrets or deployment key modification"
    - "store release configuration changes"
  C_needs_reviewer: "CHANGE_ME-architecture-team"

permissions:
  deny_read:
    - "**/*.keystore"
    - "**/*.p12"
    - "**/secrets/**"
    - ".env*"
  deny_cmd_patterns:
    - "fastlane deploy"
    - "rm -rf /"
    - "./gradlew publish"
  ask_cmd_patterns:
    - "git commit"
    - "git push"
    - "gh pr create"
    - "./gradlew assembleRelease"
  ask_write_paths:
    - "**/AndroidManifest.xml"
  allow_write_paths:
    - "app/src/**"

ticket_source:
  type: "manual"

# Governance labels applied to every PR the Coordinator opens. "ai-assisted"
# is mandatory (enforced by scripts/validate-config.mjs); add more freely.
pull_request:
  required_labels:
    - "ai-assisted"

observability:
  enabled: false
